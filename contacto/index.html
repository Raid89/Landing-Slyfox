<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Slyfox - Transformamos ideas en experiencias digitales cautivadoras. Ofrecemos soluciones en diseño web y desarrollo digital para llevar tu negocio al siguiente nivel.">
    <meta name="keywords"
        content="desarrollo web, diseño web, soluciones digitales, marketing digital, innovación, tecnología, experiencias digitales, Slyfox">
    <meta name="robots" content="index, follow">
    <meta http-equiv="Content-Language" content="es">
    <meta name="geo.region" content="CO">
    <meta name="author" content="Slyfox">
    <meta name="theme-color" content="#15242F">
    <link rel="stylesheet" href="../assets/css/variables.css">
    <link rel="stylesheet" href="../assets/css/reset.css">
    <link rel="stylesheet" href="../assets/css/styles.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="../assets/css/fonts.css">
    <link rel="stylesheet" href="../assets/css/animations.css">
    <link rel="stylesheet" href="../assets/css/header.css">
    <link rel="stylesheet" href="../assets/css/footer.css">
    <link rel="stylesheet" href="../assets/css/form.css">
    <link rel="icon" href="../assets/favicon.ico" type="image/x-icon">
    <title>Contactanos - Slyfox</title>
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Slyfox",
        "url": "https://www.slyfox.com",
        "logo": "https://www.slyfox.com/assets/icons/logo.webp",
        "sameAs": [
            "https://twitter.com/slyfox",
            "https://www.linkedin.com/company/slyfox",
            "https://www.behance.net/slyfox",
            "https://github.com/slyfox",
            "https://www.facebook.com/slyfox"
        ]
    }
    </script>
</head>

<body>
    <div class="body-padding">
        <header style="padding: 0px 31px;">
            <a href="../">
                <img src="../assets/icons/logo.webp" alt="Logotipo de Slyfox" class="h-logo white-mode">
                <img src="../assets/icons/logo-dark.png" alt="Logotipo de Slyfox" class="h-logo dark-mode">
            </a>
            <div class="h-button-dark-mode" id="dark-mode-toggle" aria-label="Toggle dark mode">
                <div class="h-bdm-icon-container">
                    <img src="../assets/icons/sun.svg" alt="Icono de sol" class="logo-header white-mode">
                    <img src="../assets/icons/moon.svg" alt="Icono de luna" class="logo-header dark-mode">
                </div>
            </div>
        </header>

        <section class="form-main-container">
            <div class="form-container">
                <div class="form-image">
                    <h1>¿Listo para transformar tu negocio? <span class="text-resalted-secondary">¡</span>Hablemos<span
                            class="text-resalted-secondary">!</span><span class="text-resalted">.</span></h1>
                    <img src="/assets/images/slyfox-with-mountains.webp" alt="">
                </div>
                <div>
                    <form   action="https://formspree.io/f/mbllpezd" method="POST">
                        <h5>¡Hola!<span class="text-resalted">.</span></h5>
                        <h6>¡Adelante y Envíanos los detalles de tu proyecto! </h6>
                        <div class="form-group">
                            <label for="name">Nombre<span class="text-resalted">*</span></label>
                            <input type="text" id="name" name="name"
                                placeholder="Escribe tu nombre o apodo, como te sientas mejor..." required>
                        </div>

                        <div class="form-group">
                            <label for="email">Correo<span class="text-resalted">*</span></label>
                            <input type="email" id="email" name="email" placeholder="tuemail@ejemplo.com" required>
                        </div>

                        <div class="form-group">
                            <label for="phone">Teléfono<span class="text-resalted">*</span></label>
                            <input type="tel" id="phone" name="phone" placeholder="301 xxx - xxx - xxx" required>
                        </div>

                        <div class="form-group">
                            <label for="message">¿Cómo podemos ayudarte?<span class="text-resalted">*</span></label>
                            <textarea name="message" id="message" cols="30" rows="10"
                                placeholder="¿Quieres que hagamos realidad tus ideas? Cuéntanos sobre tu negocio aquí."
                                required></textarea>
                        </div>

                        <div class="form-group">
                            <label for="message">¿Cuál de nuestros servicios te interesa?<span class="text-resalted">*</span></label>

                            <div class="form-group-checkbox">
                                <label class="custom-checkbox">
                                    <input type="checkbox" />
                                    <span class="checkbox"></span>
                                    <span class="label-text">Consultoría TI</span>
                                </label>
    
                                <label class="custom-checkbox">
                                    <input type="checkbox" />
                                    <span class="checkbox"></span>
                                    <span class="label-text">Diseño UX/UI</span>
                                </label>
    
                                <label class="custom-checkbox">
                                    <input type="checkbox" />
                                    <span class="checkbox"></span>
                                    <span class="label-text">Desarrollo de software a la medida</span>
                                </label>
                            </div>
                        </div>

                        
                        <button class="form-button">
                            Enviar
                        </button>
                    </form>
                </div>
            </div>
        </section>
    </div>

    <script src="../assets/js/dark-mode.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/animejs@3.2.1/lib/anime.min.js"></script>
</body>

</html>
